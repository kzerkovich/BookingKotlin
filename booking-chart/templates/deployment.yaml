apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-app
    spec:
      containers:
          - name: app
            image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
            imagePullPolicy: Never
            envFrom:
              - configMapRef:
                  name: {{ .Release.Name }}-config
            ports:
                - containerPort: 8080